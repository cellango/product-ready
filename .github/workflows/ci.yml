name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate YAML frontmatter
      run: |
        # Check SKILL.md has valid YAML frontmatter
        if ! head -5 adapters/anthropic/SKILL.md | grep -q "^---$"; then
          echo "SKILL.md missing frontmatter"
          exit 1
        fi
        # Extract and validate YAML
        sed -n '/^---$/,/^---$/p' adapters/anthropic/SKILL.md | head -n -1 | tail -n +2 | python3 -c "
        import yaml, sys
        try:
            yaml.safe_load(sys.stdin)
            print('YAML valid')
        except yaml.YAMLError as e:
            print(f'YAML error: {e}')
            sys.exit(1)
        "

    - name: Lint Markdown
      uses: DavidAnson/markdownlint-cli2-action@v16
      with:
        globs: '**/*.md'

    - name: Check links
      uses: gaurav-nelson/github-action-markdown-link-check@v1
      with:
        use-quiet-mode: 'yes'
        use-verbose-mode: 'yes'
        check-modified-files-only: 'yes'

    - name: Validate file structure
      run: |
        # Check required files exist
        required_files=("adapters/anthropic/SKILL.md" "core/product-ready-core.md" "core/guardrails.md" "README.md")
        for file in "${required_files[@]}"; do
          if [ ! -f "$file" ]; then
            echo "Missing required file: $file"
            exit 1
          fi
        done

        # Check examples directory has content
        if [ ! -d "core/examples" ] || [ -z "$(ls -A core/examples)" ]; then
          echo "Core examples directory empty"
          exit 1
        fi

        # Check templates directory has content
        if [ ! -d "core/templates" ] || [ -z "$(ls -A core/templates)" ]; then
          echo "Core templates directory empty"
          exit 1
        fi

        # Check adapters exist
        adapters=("anthropic" "openai" "slack")
        for adapter in "${adapters[@]}"; do
          if [ ! -d "adapters/$adapter" ]; then
            echo "Missing adapter: $adapter"
            exit 1
          fi
        done

    - name: Test build script
      run: |
        python3 scripts/build.py
        echo "Build script executed successfully"

    - name: Install test dependencies
      run: pip install pytest pyyaml

    - name: Run structural tests
      run: python3 -m pytest tests/test_skill.py -v