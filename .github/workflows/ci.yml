name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate YAML frontmatter
      run: |
        # Extract only the first frontmatter block and validate it.
        # sed -n '/^---$/,/^---$/p' is intentionally NOT used here — it re-enters
        # its range at every subsequent '---' in the file (e.g. Markdown horizontal
        # rules), which causes yaml.safe_load to see multiple documents and fail.
        python3 - <<'PYEOF'
        import yaml, sys
        content = open('adapters/anthropic/SKILL.md').read()
        lines = content.split('\n')
        if lines[0].strip() != '---':
            print('SKILL.md missing frontmatter')
            sys.exit(1)
        try:
            end = next(i for i, l in enumerate(lines[1:], 1) if l.strip() == '---')
        except StopIteration:
            print('SKILL.md frontmatter block never closed')
            sys.exit(1)
        fm_text = '\n'.join(lines[1:end])
        try:
            data = yaml.safe_load(fm_text)
            assert data.get('name'), 'name field missing'
            assert data.get('version'), 'version field missing'
            assert data.get('description'), 'description field missing'
            print(f"YAML valid — name={data['name']} version={data['version']}")
        except (yaml.YAMLError, AssertionError) as e:
            print(f'YAML error: {e}')
            sys.exit(1)
        PYEOF

    - name: Lint Markdown
      uses: DavidAnson/markdownlint-cli2-action@v16
      with:
        globs: '**/*.md'

    - name: Check links
      uses: gaurav-nelson/github-action-markdown-link-check@v1
      with:
        use-quiet-mode: 'yes'
        use-verbose-mode: 'yes'
        check-modified-files-only: 'yes'

    - name: Validate file structure
      run: |
        # Check required files exist
        required_files=("adapters/anthropic/SKILL.md" "core/product-ready-core.md" "core/guardrails.md" "README.md")
        for file in "${required_files[@]}"; do
          if [ ! -f "$file" ]; then
            echo "Missing required file: $file"
            exit 1
          fi
        done

        # Check examples directory has content
        if [ ! -d "core/examples" ] || [ -z "$(ls -A core/examples)" ]; then
          echo "Core examples directory empty"
          exit 1
        fi

        # Check templates directory has content
        if [ ! -d "core/templates" ] || [ -z "$(ls -A core/templates)" ]; then
          echo "Core templates directory empty"
          exit 1
        fi

        # Check adapters exist
        adapters=("anthropic" "openai" "slack")
        for adapter in "${adapters[@]}"; do
          if [ ! -d "adapters/$adapter" ]; then
            echo "Missing adapter: $adapter"
            exit 1
          fi
        done

    - name: Test build script
      run: |
        python3 scripts/build.py
        echo "Build script executed successfully"

    - name: Install test dependencies
      run: pip install pytest pyyaml slack-bolt slack-sdk anthropic openai python-dotenv

    - name: Run structural tests
      run: python3 -m pytest tests/test_skill.py -v

    - name: Run Slack bot tests
      run: python3 -m pytest tests/slack/ -v