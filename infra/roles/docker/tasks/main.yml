---
# docker — installs Docker CE and the Compose v2 plugin.
# Uses the official Docker apt repository (not the Ubuntu snap).

- name: Install Docker prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - gnupg
      - lsb-release
    state: present

- name: Add Docker GPG key
  ansible.builtin.apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64]
      https://download.docker.com/linux/ubuntu
      {{ ansible_distribution_release }} stable
    state: present
    filename: docker

- name: Install Docker CE and Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Start and enable Docker daemon
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Install Python Docker SDK (for Ansible docker modules)
  ansible.builtin.pip:
    name:
      - docker
      - docker-compose
    state: present
