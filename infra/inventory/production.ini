# Replace 1.2.3.4 with your Hetzner server IP after provisioning.
# ansible_user=root is correct for a fresh Hetzner Ubuntu server.
# After provision.yml creates the deploy user, you can switch to:
#   ansible_user=deploy

[hetzner]
prod ansible_host=1.2.3.4

[hetzner:vars]
ansible_python_interpreter=/usr/bin/python3
